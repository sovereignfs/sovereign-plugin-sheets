  <text x="52" y="39" font-size="14" fill="#52525b">Workbooks</text>
  <rect x="16" y="56" width="248" height="36" rx="8" fill="#e4e4e7"/>
  <text x="52" y="79" font-size="14" font-weight="600" fill="#18181b">Inbox</text>
  <line x1="16" y1="104" x2="264" y2="104" stroke="#e4e4e7"/>
  <text x="16" y="128" font-size="11" font-weight="600" letter-spacing="0.04em" fill="#71717a">RECENT</text>
