<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" font-family="-apple-system, 'Segoe UI', sans-serif">
  <rect width="1200" height="820" fill="#fafafa"/>

  <!-- Secondary sidebar (ThreeColumnLayout, sidebarWidth default 280) -->
  <rect x="0" y="0" width="280" height="820" fill="#f4f4f5"/>
  <line x1="280" y1="0" x2="280" y2="820" stroke="#e4e4e7"/>

  <!-- NAV: Workbooks (active) / Inbox -->
  <rect x="16" y="16" width="248" height="36" rx="8" fill="#e4e4e7"/>
  <rect x="30" y="28" width="14" height="12" rx="1" fill="#18181b"/>
  <line x1="30" y1="32" x2="44" y2="32" stroke="#f4f4f5"/>
  <line x1="30" y1="36" x2="44" y2="36" stroke="#f4f4f5"/>
  <text x="52" y="39" font-size="14" font-weight="600" fill="#18181b">Workbooks</text>

  <rect x="30" y="66" width="14" height="12" rx="2" fill="none" stroke="#52525b" stroke-width="1.5"/>
  <text x="52" y="79" font-size="14" fill="#52525b">Inbox</text>

  <line x1="16" y1="104" x2="264" y2="104" stroke="#e4e4e7"/>

  <!-- Recent group -->
  <text x="16" y="128" font-size="11" font-weight="600" letter-spacing="0.04em" fill="#71717a">RECENT</text>
  <text x="16" y="156" font-size="13" fill="#3f3f46">Q3 budget</text>
  <text x="16" y="182" font-size="13" fill="#3f3f46">Team OKRs</text>
  <text x="16" y="208" font-size="13" fill="#3f3f46">Household expenses</text>
  <text x="16" y="234" font-size="13" fill="#3f3f46">Invoice tracker</text>
  <text x="16" y="260" font-size="13" fill="#3f3f46">Vendor list</text>
  <text x="16" y="286" font-size="13" fill="#3f3f46">Untitled workbook</text>
  <text x="16" y="312" font-size="12" fill="#a1a1aa">Rent vs. buy model</text>
  <text x="16" y="336" font-size="12" fill="#a1a1aa">Marketing spend 2026</text>

  <!-- Page header -->
  <text x="312" y="56" font-size="24" font-weight="700" fill="#18181b">Sheets</text>
  <text x="312" y="78" font-size="14" fill="#71717a">Your spreadsheets.</text>
  <rect x="932" y="34" width="240" height="36" rx="8" fill="#ffffff" stroke="#d4d4d8"/>
  <circle cx="950" cy="52" r="6" fill="none" stroke="#a1a1aa" stroke-width="1.5"/>
  <line x1="954" y1="56" x2="959" y2="61" stroke="#a1a1aa" stroke-width="1.5"/>
  <text x="968" y="57" font-size="13" fill="#a1a1aa">Search workbooks…</text>

  <!-- My workbooks -->
  <text x="312" y="140" font-size="17" font-weight="600" fill="#18181b">My workbooks</text>
  <circle cx="470" cy="134" r="12" fill="#18181b"/>
  <text x="465" y="139" font-size="15" fill="#ffffff">+</text>

  <g>
    <rect x="312" y="158" width="200" height="108" rx="10" fill="#ffffff" stroke="#e4e4e7"/>
    <rect x="336" y="178" width="24" height="20" rx="3" fill="none" stroke="#71717a" stroke-width="1.5"/>
    <line x1="336" y1="188" x2="360" y2="188" stroke="#71717a" stroke-width="1"/>
    <line x1="348" y1="178" x2="348" y2="198" stroke="#71717a" stroke-width="1"/>
    <text x="330" y="248" font-size="14" font-weight="600" fill="#18181b">Q3 budget</text>
  </g>
  <g>
    <rect x="528" y="158" width="200" height="108" rx="10" fill="#ffffff" stroke="#e4e4e7"/>
    <rect x="552" y="178" width="24" height="20" rx="3" fill="none" stroke="#71717a" stroke-width="1.5"/>
    <line x1="552" y1="188" x2="576" y2="188" stroke="#71717a" stroke-width="1"/>
    <line x1="564" y1="178" x2="564" y2="198" stroke="#71717a" stroke-width="1"/>
    <text x="546" y="248" font-size="14" font-weight="600" fill="#18181b">Household expenses</text>
  </g>
  <g>
    <rect x="744" y="158" width="200" height="108" rx="10" fill="#ffffff" stroke="#e4e4e7"/>
    <rect x="768" y="178" width="24" height="20" rx="3" fill="none" stroke="#71717a" stroke-width="1.5"/>
    <line x1="768" y1="188" x2="792" y2="188" stroke="#71717a" stroke-width="1"/>
    <line x1="780" y1="178" x2="780" y2="198" stroke="#71717a" stroke-width="1"/>
    <text x="762" y="248" font-size="14" font-weight="600" fill="#18181b">Invoice tracker</text>
  </g>
  <g>
    <rect x="960" y="158" width="200" height="108" rx="10" fill="#ffffff" stroke="#e4e4e7"/>
    <rect x="984" y="178" width="24" height="20" rx="3" fill="none" stroke="#71717a" stroke-width="1.5"/>
    <line x1="984" y1="188" x2="1008" y2="188" stroke="#71717a" stroke-width="1"/>
    <line x1="996" y1="178" x2="996" y2="198" stroke="#71717a" stroke-width="1"/>
    <text x="978" y="248" font-size="14" font-weight="600" fill="#18181b">Untitled workbook</text>
  </g>

  <!-- Shared with me -->
  <text x="312" y="332" font-size="17" font-weight="600" fill="#18181b">Shared with me</text>

  <g>
    <rect x="312" y="350" width="200" height="108" rx="10" fill="#ffffff" stroke="#e4e4e7"/>
    <rect x="336" y="370" width="24" height="20" rx="3" fill="none" stroke="#71717a" stroke-width="1.5"/>
    <line x1="336" y1="380" x2="360" y2="380" stroke="#71717a" stroke-width="1"/>
    <line x1="348" y1="370" x2="348" y2="390" stroke="#71717a" stroke-width="1"/>
    <text x="330" y="440" font-size="14" font-weight="600" fill="#18181b">Team OKRs</text>
    <rect x="330" y="410" width="52" height="18" rx="9" fill="#f4f4f5" stroke="#e4e4e7"/>
    <text x="338" y="423" font-size="10" fill="#52525b">Shared</text>
  </g>
  <g>
    <rect x="528" y="350" width="200" height="108" rx="10" fill="#ffffff" stroke="#e4e4e7"/>
    <rect x="552" y="370" width="24" height="20" rx="3" fill="none" stroke="#71717a" stroke-width="1.5"/>
    <line x1="552" y1="380" x2="576" y2="380" stroke="#71717a" stroke-width="1"/>
    <line x1="564" y1="370" x2="564" y2="390" stroke="#71717a" stroke-width="1"/>
    <text x="546" y="440" font-size="14" font-weight="600" fill="#18181b">Vendor list</text>
    <rect x="546" y="410" width="52" height="18" rx="9" fill="#f4f4f5" stroke="#e4e4e7"/>
    <text x="554" y="423" font-size="10" fill="#52525b">Shared</text>
  </g>

  <!-- Annotations -->
  <text x="312" y="520" font-size="12" fill="#a1a1aa">Sidebar "Recent" lists the last 8 workbooks this user opened (owner or shared, mixed) — plain links, no owner/shared split.</text>
  <text x="312" y="540" font-size="12" fill="#a1a1aa">"My workbooks" heading has a small "+" (New workbook dialog). "Shared with me" has no add control — you can't create into someone else's workbook.</text>
  <text x="312" y="560" font-size="12" fill="#a1a1aa">Search (PageHeader action) collapses both sections into one flat match list, same precedent as Docs' HomeFoldersList.</text>
  <text x="312" y="580" font-size="12" fill="#a1a1aa">Each tile links to /sheets/w/&lt;id&gt;. Tile icon marks a workbook (table glyph) — mirrors Docs' folder-closed / file-text tile icons.</text>
</svg>
